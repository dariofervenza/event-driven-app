version: 1
disable_existing_loggers: false
formatters:
  default:
    format: "%(asctime)s - %(name)s - %(module)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
handlers:
  console:
    class: logging.StreamHandler
    formatter: default
  file:
    class: logging.handlers.TimedRotatingFileHandler
    filename: logs/event_driven.log
    formatter: default
    when: MIDNIGHT
    backupCount: 30
    encoding: utf-8
root:
  level: INFO
  handlers:
    - console
    - file
