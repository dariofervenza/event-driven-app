[project]
name = "event-driven"
version = "0.1.0"
description = "Test repository to play with event driven design"
readme = "README.md"
authors = [
    { name = "Dario Fervenza", email = "dario.fervenza.garcia@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "confluent-kafka>=2.15.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
lint = [
    "pylint>=4.0.7",
    "ruff>=0.16.4",
    "ty>=0.0.73",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]


# ==============================================================================
# Pytest Configuration
# ==============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "-ra",
    "-q"
]


[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

# ==============================================================================
# Ruff Configuration
# ==============================================================================
[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (catches common bugs)
    "UP",  # pyupgrade (modernizes Python syntax)
    "C4",  # flake8-comprehensions
]
ignore = [
]

[tool.ruff.lint.isort]
known-first-party = ["event_driven"]

# ==============================================================================
# Ty (Astral Type Checker) Configuration
# ==============================================================================
[tool.ty]
# Configures execution options for ty

# ==============================================================================
# Pylint Configuration
# ==============================================================================
[tool.pylint.main]
py-version = "3.14"
ignore-paths = []

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
    "too-few-public-methods"
]
